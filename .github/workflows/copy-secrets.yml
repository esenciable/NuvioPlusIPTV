# One-time: copies this repo's Actions secrets into your private test repo.
# Run it once from the Actions tab, then delete this file and the COPY_TOKEN secret.
# Nothing is printed: values go straight into GitHub's API, and GitHub hides secrets in logs anyway.
name: Maintenance

on:
  workflow_dispatch:

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Copy
        env:
          GH_TOKEN: ${{ secrets.COPY_TOKEN }}
          TARGET: ${{ secrets.COPY_TARGET }}
          NUVIO_BACKEND_URL: ${{ secrets.NUVIO_BACKEND_URL }}
          NUVIO_BACKEND_KEY: ${{ secrets.NUVIO_BACKEND_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          SIMKL_APP_NAME: ${{ secrets.SIMKL_APP_NAME }}
          MDBLIST_CLIENT_ID: ${{ secrets.MDBLIST_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          DRIVE_REFRESH_TOKEN: ${{ secrets.DRIVE_REFRESH_TOKEN }}
          PREMIUMIZE_CLIENT_ID: ${{ secrets.PREMIUMIZE_CLIENT_ID }}
          IMDB_RATINGS_API_BASE_URL: ${{ secrets.IMDB_RATINGS_API_BASE_URL }}
          IMDB_TAPFRAME_API_BASE_URL: ${{ secrets.IMDB_TAPFRAME_API_BASE_URL }}
          INTRODB_API_URL: ${{ secrets.INTRODB_API_URL }}
          LIVETV_KEYSTORE_BASE64: ${{ secrets.LIVETV_KEYSTORE_BASE64 }}
        run: |
          set -eu
          copied=0
          for name in NUVIO_BACKEND_URL NUVIO_BACKEND_KEY TMDB_API_KEY TRAKT_CLIENT_ID TRAKT_CLIENT_SECRET \
            SIMKL_CLIENT_ID SIMKL_APP_NAME MDBLIST_CLIENT_ID GOOGLE_DRIVE_CLIENT_ID GOOGLE_DRIVE_CLIENT_SECRET \
            DRIVE_REFRESH_TOKEN PREMIUMIZE_CLIENT_ID IMDB_RATINGS_API_BASE_URL IMDB_TAPFRAME_API_BASE_URL \
            INTRODB_API_URL LIVETV_KEYSTORE_BASE64; do
            value="${!name}"
            [ -z "$value" ] && continue
            printf '%s' "$value" | gh secret set "$name" --repo "$TARGET" > /dev/null
            copied=$((copied + 1))
          done
          echo "Copied $copied values."
